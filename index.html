body.ready::before{opacity:1}

/* top: the tabs and the blue line */
.top{max-width:1100px;width:100%;margin:0 auto;padding:44px 40px 0}
.nav-row{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;border-bottom:2px solid var(--blue)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs a{position:relative;font:700 var(--fs-tab)/1.2 var(--font);color:var(--blue);text-decoration:none;padding:7px 16px 12px;letter-spacing:-.01em;border-radius:9px 9px 0 0}
.tabs a[aria-current="page"]{background:#fff;margin-bottom:-2px}
.tabs a[aria-current="page"]::before{content:"";position:absolute;inset:0;border:2px solid var(--blue);border-bottom:0;border-radius:9px 9px 0 0;pointer-events:none}

/* page content */
.content{flex:1;max-width:1100px;width:100%;margin:0 auto;padding:54px 40px 64px}
.lead{font-size:var(--fs-body);line-height:1.75;color:var(--body);max-width:44em;margin-bottom:34px}
.soon{font-size:var(--fs-body);color:var(--grey)}

/* about */
.about{display:grid;grid-template-columns:auto minmax(0,1fr);gap:56px;align-items:start;width:max-content;max-width:100%;margin:0 auto}
.hi{font:700 var(--fs-greet)/1.25 var(--font);color:var(--blue);letter-spacing:-.005em;margin-bottom:14px}
.photo{position:relative;width:260px;height:322px;border-radius:6px;overflow:hidden;background:var(--soft)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mono{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 68px var(--font);color:var(--blue);opacity:.3}
.about .txt{font-size:var(--fs-body);line-height:1.75;color:var(--body);max-width:28em}

/* research */
.two{display:grid;grid-template-columns:1fr 1fr;gap:56px}
.proj h2{font:700 var(--fs-sub)/1.3 var(--font);color:var(--text);margin-bottom:10px}
.proj p{color:var(--body);font-size:16px;line-height:1.75}
.tag{display:inline-block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--blue);border:1px solid rgba(10,79,163,.4);border-radius:999px;padding:3px 11px;margin-bottom:14px}
.status{display:block;margin-top:14px;font-size:14px;color:var(--grey)}

/* projects */
.links{list-style:none}
.links li{padding:16px 0;border-top:1px solid var(--rule)}
.links li:last-child{border-bottom:1px solid var(--rule)}
.links a{font-weight:700;font-size:var(--fs-sub);color:var(--blue);text-decoration:none}
.links a:hover{text-decoration:underline}
.links span{display:block;font-size:15px;color:var(--grey);margin-top:3px}

/* gallery: the cloud chamber */
.content.fill{display:flex;flex-direction:column}
.content.fill .chamber{flex:1}
.chamber{position:relative;height:340px;min-height:340px;border-radius:6px;overflow:hidden}
.chamber canvas{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-mask-image:radial-gradient(ellipse 62% 70% at 50% 50%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 62% 70% at 50% 50%,#000 55%,transparent 100%)}
.chamber .soon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;letter-spacing:.04em;text-shadow:0 0 12px #fff,0 0 4px #fff;pointer-events:none}

/* bottom line */
.foot{max-width:1100px;width:100%;margin:0 auto;padding:18px 40px 30px;display:flex;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;font-size:13.5px;color:var(--grey);background:linear-gradient(var(--rule),var(--rule)) 40px 0/calc(100% - 80px) 1px no-repeat}
.foot a{color:var(--blue);font-weight:700;text-decoration:none}
.foot a:hover{text-decoration:underline}

/* gentle entrance */
.top,.content,.foot{opacity:0}
body.ready .top,body.ready .content,body.ready .foot{opacity:1}
body.ready .top{animation:rise .8s ease backwards}
body.ready .content{animation:rise .9s ease .25s backwards}
body.ready .foot{animation:rise .9s ease .45s backwards}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tabs a{transition:opacity .2s}
body.ready .tabs a:hover{opacity:.72}

@media (max-width:820px){
  .top{padding:26px 22px 0}
  .nav-row{flex-direction:column;align-items:flex-start;gap:0}
  .tabs{gap:0;flex-wrap:nowrap}
  .tabs a{font-size:clamp(10.5px,3.2vw,17px);padding:6px 4px 11px;white-space:nowrap;border-radius:6px 6px 0 0}
  .tabs a[aria-current="page"]::before{border-radius:6px 6px 0 0}
    .content{padding:36px 22px 48px}
  .about{gap:28px}
  .photo{width:210px;height:260px}
  .mono{font-size:56px}
  .hi{font-size:26px;margin-bottom:12px}
  .two{grid-template-columns:1fr;gap:34px}
  .chamber{height:240px;min-height:240px}
  .foot{padding:16px 22px 24px;background-position:22px 0;background-size:calc(100% - 44px) 1px}
}
@media (min-width:521px) and (max-width:820px){
  .tabs a{padding:6px clamp(4px,1.2vw,10px) 12px}
}
@media (max-width:560px){
  .about{grid-template-columns:1fr;gap:26px;width:100%}

}
@media (max-width:820px){
  body::before{background-size:190% auto;background-position:center 64%}
}

<script>
(function(){
  const root=document.documentElement, body=document.body;
  if(!root.classList.contains('intro')){ body.classList.add('ready'); return; }
  const canvas=document.getElementById('tunnel'), skipBtn=document.getElementById('skip');
  let offset=0;
  const ctx=canvas.getContext('2d'); let W,H;
  function size(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
  size(); window.addEventListener('resize',size);
  const ease=t=>t<0.5?2*t*t:-1+(4-2*t)*t;
  const band=(p,a,b)=>Math.max(0,Math.min(1,(p-a)/(b-a)));
  const T={tubeIn:[800,2800],travel:[800,4200],waltz:[3000,4800],boom:[4800,7200],fadeOut:[6800,8800]};
  const R=1.0,NSEGS=36,Lx=-0.6,Ly=-0.8;
  const project=(wx,wy,wz)=>{const f=H*0.88;return{x:W*.5+(wx/wz)*f,y:H*.5+(wy/wz)*f};};

  function cylinder(camZ,alpha){
    if(alpha<=0) return;
    const spacing=0.12,zNear=0.15,zFar=4.0;
    const iMin=Math.ceil((camZ+zNear)/spacing), iMax=Math.floor((camZ+zFar)/spacing);
    for(let i=iMax;i>=iMin;i--){
      const wz=i*spacing-camZ; if(wz<zNear||wz>zFar) continue;
      const depthT=1-(wz-zNear)/(zFar-zNear), fogA=Math.pow(depthT,0.5);
      const ringA=Math.min(1,(wz-zNear)/(spacing*3))*Math.min(1,(zFar-wz)/(spacing*3)); if(ringA<0.005) continue;
      const wz2=Math.max(0.05,wz-spacing);
      for(let ai=0;ai<NSEGS;ai++){
        const a0=(ai/NSEGS)*Math.PI*2,a1=((ai+1)/NSEGS)*Math.PI*2,aMid=(a0+a1)*0.5;
        const diffuse=Math.max(0,-Math.cos(aMid)*Lx-Math.sin(aMid)*Ly);
        const l=0.04+diffuse*0.28+fogA*0.05;
        const rr=Math.round(l*15+fogA*4),gg=Math.round(l*55+fogA*10),bb=Math.round(l*220+fogA*30);
        const p00=project(Math.cos(a0)*R,Math.sin(a0)*R,wz),p10=project(Math.cos(a1)*R,Math.sin(a1)*R,wz);
        const p01=project(Math.cos(a0)*R,Math.sin(a0)*R,wz2),p11=project(Math.cos(a1)*R,Math.sin(a1)*R,wz2);
        ctx.beginPath();ctx.moveTo(p00.x,p00.y);ctx.lineTo(p10.x,p10.y);ctx.lineTo(p11.x,p11.y);ctx.lineTo(p01.x,p01.y);ctx.closePath();
        ctx.fillStyle=`rgba(${rr},${gg},${bb},${alpha*(0.6+fogA*0.35)*ringA})`;ctx.fill();
        if(i%8===0){ctx.beginPath();ctx.moveTo(p00.x,p00.y);ctx.lineTo(p10.x,p10.y);ctx.strokeStyle=`rgba(60,120,255,${alpha*fogA*0.18*ringA})`;ctx.lineWidth=0.6;ctx.stroke();}
      }
    }
    const vg=ctx.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,H*0.25);
    vg.addColorStop(0,`rgba(8,35,130,${alpha*0.6})`);vg.addColorStop(0.6,`rgba(3,12,50,${alpha*0.25})`);vg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=vg;ctx.beginPath();ctx.arc(W*.5,H*.5,H*0.25,0,Math.PI*2);ctx.fill();
  }
  function particle(x,y,alpha){
    if(alpha<=0) return;
    const g=ctx.createRadialGradient(x,y,0,x,y,22);
    g.addColorStop(0,`rgba(100,180,255,${alpha*0.65})`);g.addColorStop(0.45,`rgba(40,100,220,${alpha*0.25})`);g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,22,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fillStyle=`rgba(190,220,255,${alpha})`;ctx.fill();
  }
  const TA=Array.from({length:12},(_,i)=>(i/12)*Math.PI*2+i*0.4), TL=Array.from({length:12},(_,i)=>0.55+((i*5)%6)*0.08);
  const dust=Array.from({length:35},()=>({x:Math.random(),y:Math.random(),r:0.35+Math.random()*0.9,vy:0.00007+Math.random()*0.00011,vx:(Math.random()-.5)*0.00004}));

  let start=null,last=0,readyShown=false;
  skipBtn.addEventListener('click',()=>{ if(start!==null){ const now=performance.now(); const ms=now-start+offset; if(ms<T.fadeOut[0]) offset=T.fadeOut[0]-(now-start); } });
  setTimeout(()=>skipBtn.classList.add('show'),700);

  function frame(ts){
    if(start===null) start=ts;
    const ms=ts-start+offset, dt=ts-last; last=ts;
    for(const d of dust){d.x+=d.vx*dt;d.y+=d.vy*dt;if(d.y>1.05){d.y=-0.05;d.x=Math.random();}if(d.x<0)d.x+=1;if(d.x>1)d.x-=1;}
    ctx.clearRect(0,0,W,H);
    const cx=W*.5,cy=H*.5, tb=(a,b)=>band(ms,a,b);
    const phTube=ease(tb(T.tubeIn[0],T.tubeIn[1])), phTravel=Math.pow(tb(T.travel[0],T.travel[1]),1.8), phBoom=tb(T.boom[0],T.boom[1]), phFade=ease(tb(T.fadeOut[0],T.fadeOut[1]));
    const bgB=phTube*(1-Math.min(phBoom*1.5,1)), v=Math.round(255*phFade);
    ctx.fillStyle=phFade>0?`rgb(${v},${v},${v})`:`rgb(${Math.round(bgB*4)},${Math.round(bgB*9)},${Math.round(bgB*22)})`; ctx.fillRect(0,0,W,H);
    if(phBoom<0.15&&phTube<0.6){const da=0.055*(1-phTube*1.8)*(1-phBoom*6);if(da>0)for(const d of dust){ctx.beginPath();ctx.arc(d.x*W,d.y*H,d.r,0,Math.PI*2);ctx.fillStyle=`rgba(80,130,255,${da})`;ctx.fill();}}
    const cylA=phTube*Math.max(0,1-phBoom*2.2)*Math.max(0,1-phFade*1.5);
    if(cylA>0) cylinder(phTravel*2.0, cylA);
    const startX=W*0.28,circleR=W*0.13,waltzR=W*0.04;
    const pStr=tb(T.travel[0],T.waltz[0]),pCirc=tb(T.waltz[0],T.waltz[0]+700),pWltz=tb(T.waltz[0]+700,T.boom[0]);
    let p1x,p1y,p2x,p2y;
    if(pWltz>0){const o=waltzR*(1-ease(pWltz)),a=pWltz*Math.PI*2*3;p1x=cx+Math.cos(a)*o;p1y=cy+Math.sin(a)*o*0.45;p2x=cx+Math.cos(a+Math.PI)*o;p2y=cy+Math.sin(a+Math.PI)*o*0.45;}
    else if(pCirc>0){const o=circleR,a=pCirc*Math.PI*4;p1x=cx+Math.cos(a)*o;p1y=cy+Math.sin(a)*o*0.45;p2x=cx+Math.cos(a+Math.PI)*o;p2y=cy+Math.sin(a+Math.PI)*o*0.45;}
    else{const t=ease(pStr);p1x=cx-startX+t*(startX-circleR);p1y=cy;p2x=cx+startX-t*(startX-circleR);p2y=cy;}
    const pA=Math.min(1,tb(T.travel[0],T.travel[0]+400))*(1-Math.min(1,phBoom*7))*(1-phFade*3);
    if(phFade<0.35){particle(p1x,p1y,pA);particle(p2x,p2y,pA);}
    if(phBoom>0&&phFade<0.9){
      const bf=1-phFade, early=1-band(phBoom,0.35,0.7);
      const r1=Math.max(0,0.45-phBoom*0.45)*bf*early; if(r1>0){ctx.beginPath();ctx.arc(cx,cy,phBoom*200,0,Math.PI*2);ctx.strokeStyle=`rgba(45,110,230,${r1})`;ctx.lineWidth=1;ctx.stroke();}
      const r2=Math.max(0,0.18-phBoom*0.18)*bf*early; if(r2>0){ctx.beginPath();ctx.arc(cx,cy,phBoom*340,0,Math.PI*2);ctx.strokeStyle=`rgba(45,110,230,${r2})`;ctx.lineWidth=1;ctx.stroke();}
      const tg=band(phBoom,0,0.38),tf=band(phBoom,0.5,0.8),ta=(1-tf)*0.55*bf;
      if(ta>0){const bR=Math.min(W,H)*0.28;for(let i=0;i<12;i++){const len=bR*TL[i]*tg;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(TA[i])*len,cy+Math.sin(TA[i])*len);ctx.strokeStyle=`rgba(55,120,240,${ta})`;ctx.lineWidth=0.8;ctx.stroke();}}
      const gA=Math.max(0,1-phBoom*2)*bf;
      if(gA>0){const fg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*0.26);fg.addColorStop(0,`rgba(55,125,255,${gA*0.48})`);fg.addColorStop(0.4,`rgba(20,65,200,${gA*0.2})`);fg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=fg;ctx.fillRect(0,0,W,H);}
    }
    if(phFade<0.999) requestAnimationFrame(frame);
    else {
      skipBtn.style.display='none';
      try{ sessionStorage.setItem('introSeen','1'); }catch(e){}
      body.classList.add('ready'); root.classList.remove('intro');
    }
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
