<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shalini Epari</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; }
canvas { display: block; width: 100%; height: 100%; position: fixed; inset: 0; }

#top-nav {
  position: fixed; top: 28px; right: 36px;
  display: flex; gap: 28px; z-index: 10;
  pointer-events: none; opacity: 0;
  transition: opacity 1.6s ease;
}
#top-nav.visible { opacity: 1; pointer-events: auto; }
#top-nav a {
  font-size: 13px; letter-spacing: 0.04em; color: #5aadff;
  text-decoration: none; transition: opacity 0.15s;
}
#top-nav a:hover { opacity: 0.6; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<nav id="top-nav">
  <a href="cv.pdf">CV</a>
  <a href="research.html">Research</a>
  <a href="students.html">Student Projects</a>
  <a href="gallery.html">Gallery</a>
  <a href="blog.html">Blog</a>
  <a href="mailto:shalini.epari@cern.ch">Contact</a>
</nav>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const topNav = document.getElementById('top-nav');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

function band(p,a,b){ return Math.max(0,Math.min(1,(p-a)/(b-a))); }
function ease(t){ return t<0.5?2*t*t:-1+(4-2*t)*t; }
function tband(ms,a,b){ return Math.max(0,Math.min(1,(ms-a)/(b-a))); }

const T = {
  tubeIn:  [800,  2800],
  travel:  [800,  4200],
  waltz:   [3000, 4800],
  boom:    [4800, 7200],
  fadeOut: [6400, 7800],
};

function project(wx,wy,wz){
  const f=H*0.88;
  return {x:W*0.5+(wx/wz)*f, y:H*0.5+(wy/wz)*f};
}
const R=1.0, NSEGS=36, Lx=-0.6, Ly=-0.8;

function drawCylinder(camZ, alpha){
  if(alpha<=0) return;
  const spacing=0.12, zNear=0.15, zFar=4.0;
  const iMin=Math.ceil((camZ+zNear)/spacing);
  const iMax=Math.floor((camZ+zFar)/spacing);
  for(let i=iMax;i>=iMin;i--){
    const wz=i*spacing-camZ;
    if(wz<zNear||wz>zFar) continue;
    const depthT=1-(wz-zNear)/(zFar-zNear);
    const fogA=Math.pow(depthT,0.5);
    const fadeIn=Math.min(1,(wz-zNear)/(spacing*3));
    const fadeOut=Math.min(1,(zFar-wz)/(spacing*3));
    const ringA=fadeIn*fadeOut;
    if(ringA<0.005) continue;
    const wz2=Math.max(0.05,wz-spacing);
    for(let ai=0;ai<NSEGS;ai++){
      const a0=(ai/NSEGS)*Math.PI*2, a1=((ai+1)/NSEGS)*Math.PI*2, aMid=(a0+a1)*0.5;
      const nx=-Math.cos(aMid), ny=-Math.sin(aMid);
      const diffuse=Math.max(0,nx*Lx+ny*Ly);
      const l=0.04+diffuse*0.28+fogA*0.05;
      const rr=Math.round(l*15+fogA*4), gg=Math.round(l*55+fogA*10), bb=Math.round(l*220+fogA*30);
      const p00=project(Math.cos(a0)*R,Math.sin(a0)*R,wz);
      const p10=project(Math.cos(a1)*R,Math.sin(a1)*R,wz);
      const p01=project(Math.cos(a0)*R,Math.sin(a0)*R,wz2);
      const p11=project(Math.cos(a1)*R,Math.sin(a1)*R,wz2);
      ctx.beginPath();
      ctx.moveTo(p00.x,p00.y); ctx.lineTo(p10.x,p10.y);
      ctx.lineTo(p11.x,p11.y); ctx.lineTo(p01.x,p01.y);
      ctx.closePath();
      ctx.fillStyle=`rgba(${rr},${gg},${bb},${alpha*(0.6+fogA*0.35)*ringA})`;
      ctx.fill();
      if(i%8===0){
        ctx.beginPath(); ctx.moveTo(p00.x,p00.y); ctx.lineTo(p10.x,p10.y);
        ctx.strokeStyle=`rgba(60,120,255,${alpha*fogA*0.18*ringA})`; ctx.lineWidth=0.6; ctx.stroke();
      }
    }
  }
  const vg=ctx.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,H*0.25);
  vg.addColorStop(0,`rgba(8,35,130,${alpha*0.6})`);
  vg.addColorStop(0.6,`rgba(3,12,50,${alpha*0.25})`);
  vg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=vg; ctx.beginPath(); ctx.arc(W*.5,H*.5,H*0.25,0,Math.PI*2); ctx.fill();
}

function drawParticle(x,y,alpha){
  if(alpha<=0) return;
  const g=ctx.createRadialGradient(x,y,0,x,y,22);
  g.addColorStop(0,`rgba(100,180,255,${alpha*0.65})`);
  g.addColorStop(0.45,`rgba(40,100,220,${alpha*0.25})`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,22,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2);
  ctx.fillStyle=`rgba(190,220,255,${alpha})`; ctx.fill();
}

const TRACK_ANGLES=Array.from({length:12},(_,i)=>(i/12)*Math.PI*2+i*0.4);
const TRACK_LENS  =Array.from({length:12},(_,i)=>0.55+((i*5)%6)*0.08);

const dust=Array.from({length:35},()=>({
  x:Math.random(), y:Math.random(), r:0.35+Math.random()*0.9,
  vy:0.00007+Math.random()*0.00011, vx:(Math.random()-.5)*0.00004,
}));
function stepDust(dt){
  for(const d of dust){
    d.x+=d.vx*dt; d.y+=d.vy*dt;
    if(d.y>1.05){d.y=-0.05;d.x=Math.random();}
    if(d.x<0)d.x+=1; if(d.x>1)d.x-=1;
  }
}

let startTime=null, lastT=0, navShown=false;

function draw(ts){
  if(!startTime) startTime=ts;
  const ms=ts-startTime;
  const dt=ts-lastT; lastT=ts;
  stepDust(dt);

  ctx.clearRect(0,0,W,H);
  const cx=W*0.5, cy=H*0.5;

  const phTube   = ease(tband(ms,T.tubeIn[0],T.tubeIn[1]));
  const phTravel = Math.pow(tband(ms,T.travel[0],T.travel[1]),1.8);
  const phBoom   = tband(ms,T.boom[0],T.boom[1]);
  const phFade   = ease(tband(ms,T.fadeOut[0],T.fadeOut[1]));

  // Background: black → white
  const bgWhite = phFade;
  const bgDark  = phTube*(1-Math.min(phBoom*1.5,1))*(1-phFade);
  const bgVal   = Math.round(bgWhite*255);
  const bgBlue  = Math.round(bgDark*22);
  ctx.fillStyle = phFade>0
    ? `rgb(${bgVal},${bgVal},${bgVal})`
    : `rgb(${Math.round(bgDark*4)},${Math.round(bgDark*9)},${bgBlue})`;
  ctx.fillRect(0,0,W,H);

  // Dust
  if(phBoom<0.15&&phTube<0.6){
    const da=0.055*(1-phTube*1.8)*(1-phBoom*6);
    if(da>0) for(const d of dust){
      ctx.beginPath(); ctx.arc(d.x*W,d.y*H,d.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(80,130,255,${da})`; ctx.fill();
    }
  }

  // Cylinder
  if(phFade<0.8) drawCylinder(phTravel*2.0, phTube*(1-Math.max(0,phBoom*2.2))*(1-phFade*1.5));

  // Particles
  const startX=W*0.28, circleR=W*0.13, waltzR=W*0.04;
  const pStr  = tband(ms,T.travel[0],T.waltz[0]);
  const pCirc = tband(ms,T.waltz[0],T.waltz[0]+700);
  const pWltz = tband(ms,T.waltz[0]+700,T.boom[0]);
  let p1x,p1y,p2x,p2y;
  if(pWltz>0){
    const orbit=waltzR*(1-ease(pWltz));
    const ang=pWltz*Math.PI*2*3.0;
    p1x=cx+Math.cos(ang)*orbit;          p1y=cy+Math.sin(ang)*orbit*0.45;
    p2x=cx+Math.cos(ang+Math.PI)*orbit;  p2y=cy+Math.sin(ang+Math.PI)*orbit*0.45;
  } else if(pCirc>0){
    const orbit=circleR;
    const ang=pCirc*Math.PI*4;
    p1x=cx+Math.cos(ang)*orbit;          p1y=cy+Math.sin(ang)*orbit*0.45;
    p2x=cx+Math.cos(ang+Math.PI)*orbit;  p2y=cy+Math.sin(ang+Math.PI)*orbit*0.45;
  } else {
    const t=ease(pStr); const ex=circleR;
    p1x=cx-startX+t*(startX-ex); p1y=cy;
    p2x=cx+startX-t*(startX-ex); p2y=cy;
  }

  const pAlpha=Math.min(1,tband(ms,T.travel[0],T.travel[0]+400))*(1-Math.min(1,phBoom*7))*(1-phFade*3);
  if(phFade<0.35){ drawParticle(p1x,p1y,pAlpha); drawParticle(p2x,p2y,pAlpha); }

  // Boom
  if(phBoom>0&&phFade<0.9){
    const bf=1-phFade;
    const ring1a=Math.max(0,0.45-phBoom*0.45)*bf;
    if(ring1a>0){ ctx.beginPath();ctx.arc(cx,cy,phBoom*200,0,Math.PI*2);ctx.strokeStyle=`rgba(45,110,230,${ring1a})`;ctx.lineWidth=1.0;ctx.stroke(); }
    const ring2a=Math.max(0,0.18-phBoom*0.18)*bf;
    if(ring2a>0){ ctx.beginPath();ctx.arc(cx,cy,phBoom*340,0,Math.PI*2);ctx.strokeStyle=`rgba(45,110,230,${ring2a})`;ctx.lineWidth=1.0;ctx.stroke(); }
    const trkGrow=band(phBoom,0.0,0.38), trkFade=band(phBoom,0.50,0.80);
    const trkAlpha=(1-trkFade)*0.55*bf;
    if(trkAlpha>0){
      const bR=Math.min(W,H)*0.28;
      for(let i=0;i<12;i++){
        const len=bR*TRACK_LENS[i]*trkGrow;
        ctx.beginPath();ctx.moveTo(cx,cy);
        ctx.lineTo(cx+Math.cos(TRACK_ANGLES[i])*len,cy+Math.sin(TRACK_ANGLES[i])*len);
        ctx.strokeStyle=`rgba(55,120,240,${trkAlpha})`;ctx.lineWidth=0.8;ctx.stroke();
      }
    }
    const glowA=Math.max(0,1-phBoom*2.0)*bf;
    if(glowA>0){
      const fg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*0.26);
      fg.addColorStop(0,`rgba(55,125,255,${glowA*0.48})`);
      fg.addColorStop(0.4,`rgba(20,65,200,${glowA*0.2})`);
      fg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=fg; ctx.fillRect(0,0,W,H);
    }
  }

  // Nav fades in with white
  if(phFade>0.5&&!navShown){ navShown=true; topNav.classList.add('visible'); }

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
