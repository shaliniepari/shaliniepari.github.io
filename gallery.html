<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery — Shalini Epari</title>
<meta name="description" content="Photographs of the ATLAS detector, the lab, and outreach work.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%230a4fa3' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%230a4fa3'/%3E%3C/svg%3E">
<style>
/* Shared look: this block is identical in every page. */
:root{
  --blue:#0a4fa3; --text:#1d2733; --body:#44505e; --grey:#7a8592; --soft:#e9eff8; --rule:#dbe4f1;
  --font:"Lucida Grande","Lucida Sans Unicode","Lucida Sans",Verdana,"DejaVu Sans",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;background:#fff}
body{min-height:100vh;display:flex;flex-direction:column;background:#fff;color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a:focus-visible{outline:2px solid var(--blue);outline-offset:4px;border-radius:3px}

/* top: the tabs and the blue line */
.top{max-width:1100px;width:100%;margin:0 auto;padding:44px 40px 0}
.nav-row{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;border-bottom:2px solid var(--blue)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs a{position:relative;font:700 28px/1.2 var(--font);color:var(--blue);text-decoration:none;padding:8px 18px 14px;letter-spacing:-.01em;border-radius:9px 9px 0 0}
.tabs a[aria-current="page"]{background:#fff;margin-bottom:-2px}
.tabs a[aria-current="page"]::before{content:"";position:absolute;inset:0;border:2px solid var(--blue);border-bottom:0;border-radius:9px 9px 0 0;pointer-events:none}

/* page content */
.content{flex:1;max-width:1100px;width:100%;margin:0 auto;padding:54px 40px 64px}
.lead{font-size:17px;line-height:1.75;color:var(--body);max-width:44em;margin-bottom:34px}
.soon{font-size:17px;color:var(--grey)}

/* about */
.about{display:grid;grid-template-columns:auto minmax(0,1fr);gap:56px;align-items:start}
.photo{position:relative;width:300px;height:370px;border-radius:6px;overflow:hidden;background:var(--soft)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mono{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 80px var(--font);color:var(--blue);opacity:.3}
.who{font-weight:700;font-size:24px;color:var(--text)}
.role{color:var(--grey);font-size:15px;margin:4px 0 20px;line-height:1.65}
.about .txt{font-size:19px;line-height:1.75;color:var(--body);max-width:34em}

/* research */
.two{display:grid;grid-template-columns:1fr 1fr;gap:56px}
.proj h2{font:700 20px/1.3 var(--font);color:var(--text);margin-bottom:10px}
.proj p{color:var(--body);font-size:16.5px;line-height:1.75}
.tag{display:inline-block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--blue);border:1px solid rgba(10,79,163,.4);border-radius:999px;padding:3px 11px;margin-bottom:14px}
.status{display:block;margin-top:14px;font-size:14px;color:var(--grey)}

/* projects */
.links{list-style:none}
.links li{padding:16px 0;border-top:1px solid var(--rule)}
.links li:last-child{border-bottom:1px solid var(--rule)}
.links a{font-weight:700;font-size:18px;color:var(--blue);text-decoration:none}
.links a:hover{text-decoration:underline}
.links span{display:block;font-size:15px;color:var(--grey);margin-top:3px}

/* gallery: the cloud chamber */
.content.fill{display:flex;flex-direction:column}
.content.fill .chamber{flex:1}
.chamber{position:relative;height:340px;min-height:340px;border-radius:6px;overflow:hidden}
.chamber canvas{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-mask-image:radial-gradient(ellipse 62% 70% at 50% 50%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 62% 70% at 50% 50%,#000 55%,transparent 100%)}
.chamber .soon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;letter-spacing:.04em;text-shadow:0 0 12px #fff,0 0 4px #fff;pointer-events:none}

/* bottom line */
.foot{max-width:1100px;width:100%;margin:0 auto;padding:18px 40px 30px;display:flex;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;font-size:13.5px;color:var(--grey);background:linear-gradient(var(--rule),var(--rule)) 40px 0/calc(100% - 80px) 1px no-repeat}
.foot a{color:var(--blue);font-weight:700;text-decoration:none}
.foot a:hover{text-decoration:underline}

/* gentle entrance */
.top,.content,.foot{opacity:0}
body.ready .top,body.ready .content,body.ready .foot{opacity:1}
body.ready .top{animation:rise .8s ease backwards}
body.ready .content{animation:rise .9s ease .25s backwards}
body.ready .foot{animation:rise .9s ease .45s backwards}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tabs a{transition:opacity .2s}
body.ready .tabs a:hover{opacity:.72}

@media (max-width:820px){
  .top{padding:26px 22px 0}
  .nav-row{flex-direction:column;align-items:flex-start;gap:0}
  .tabs{gap:0;flex-wrap:nowrap}
  .tabs a{font-size:clamp(10.5px,3.2vw,22px);padding:6px 4px 11px;white-space:nowrap;border-radius:6px 6px 0 0}
  .tabs a[aria-current="page"]::before{border-radius:6px 6px 0 0}
    .content{padding:36px 22px 48px}
  .about{grid-template-columns:1fr;gap:26px}
  .photo{width:100%;height:340px}
  .about .txt{font-size:17.5px}
  .two{grid-template-columns:1fr;gap:34px}
  .chamber{height:240px;min-height:240px}
  .foot{padding:16px 22px 24px;background-position:22px 0;background-size:calc(100% - 44px) 1px}
}
@media (prefers-reduced-motion:reduce){body.ready *{animation:none!important}}
</style>
<noscript><style>.top,.content,.foot,.tabs a{opacity:1!important}</style></noscript>
</head>
<body class="ready">
<header class="top">
  <div class="nav-row">
    <nav class="tabs" aria-label="Main"><a href="index.html" style="--i:0">About me</a><a href="research.html" style="--i:1">Research</a><a href="projects.html" style="--i:2">Projects</a><a href="outreach.html" style="--i:3">Outreach</a><a href="gallery.html" style="--i:4" aria-current="page">Gallery</a></nav>
  </div>
</header>
<main class="content fill">
<h1 class="sr-only">Gallery</h1>
<div class="chamber" id="chamber"><canvas id="chamber-cv" aria-hidden="true"></canvas><p class="soon">Coming soon.</p></div>
</main>
<footer class="foot"><span>Write to me at: <a href="mailto:shalini.epari@cern.ch">shalini.epari@cern.ch</a></span><a href="cv.pdf">Download CV</a></footer>
<script>
/* Gallery cloud chamber. Never more than 2 tracks on screen at once. */
(function(){
  const wrap=document.getElementById('chamber'), cv=document.getElementById('chamber-cv');
  if(!wrap||!cv||window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=cv.getContext('2d'); let CW=0,CH=0;
  function size(){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    CW=wrap.clientWidth; CH=wrap.clientHeight;
    cv.width=Math.round(CW*dpr); cv.height=Math.round(CH*dpr);
    c.setTransform(dpr,0,0,dpr,0,0);
  }
  size(); window.addEventListener('resize',size);

  const MAX=2, HOLD=2200, FADE=5000;
  const rnd=(a,b)=>a+Math.random()*(b-a), sgn=()=>Math.random()<0.5?-1:1;
  const fade=age=>age<HOLD?1:Math.max(0,1-(age-HOLD)/FADE);
  const diffuse=age=>1+Math.max(0,age-HOLD*0.4)/FADE*2.4;
  const tracks=[]; /*HOOK*/
  let now=performance.now();

  function add(o){
    const t=Object.assign({k:0,dk:0,jit:0.005,w:1.2,a:0.55,speed:0.09,target:400,drop:0.45,done:false,traveled:0},o);
    t.pts=[{x:t.x,y:t.y,t:now,dx:0,dy:0,r:0}]; tracks.push(t);
  }
  function electron(){ const s=sgn(); add({x:rnd(CW*0.12,CW*0.88),y:rnd(CH*0.38,CH*0.62),ang:rnd(0,Math.PI*2),speed:rnd(0.07,0.11),target:rnd(380,760),k:s*rnd(0.008,0.016),dk:s*rnd(0.000008,0.00002)}); }
  function muon(){ const left=Math.random()<0.5; add({x:left?-10:CW+10,y:rnd(CH*0.15,CH*0.85),ang:(left?0:Math.PI)+rnd(-0.3,0.3),speed:rnd(0.12,0.17),target:2400,k:rnd(-0.0006,0.0006),jit:0.003,w:1.1,a:0.45,drop:0.3}); }
  function spawn(){ if(Math.random()<0.8) electron(); else muon(); }

  function step(t,dt){
    if(t.done) return;
    let dist=t.speed*dt;
    while(dist>0&&!t.done){
      const s=Math.min(4,dist); dist-=s;
      t.ang+=t.k*s+(Math.random()-0.5)*2*t.jit; t.k+=t.dk*s;
      t.x+=Math.cos(t.ang)*s; t.y+=Math.sin(t.ang)*s; t.traveled+=s;
      const has=Math.random()<t.drop, sp=2+t.w*1.2;
      t.pts.push({x:t.x,y:t.y,t:now,dx:has?rnd(-sp,sp):0,dy:has?rnd(-sp,sp):0,r:has?rnd(0.4,1.0)*(0.7+t.w*0.22):0});
      if(t.traveled>=t.target||t.x<-120||t.x>CW+120||t.y<-120||t.y>CH+120) t.done=true;
    }
  }
  function draw(t){
    const pts=t.pts,n=pts.length,CHUNK=3;
    c.lineCap='round'; c.lineJoin='round';
    for(let i=1;i<n;i+=CHUNK){
      const end=Math.min(n-1,i+CHUNK-1), mid=pts[Math.min(n-1,i+1)];
      const age=now-mid.t, f=fade(age); if(f<=0) continue;
      const df=diffuse(age), al=t.a*f;
      c.beginPath(); c.moveTo(pts[i-1].x,pts[i-1].y);
      for(let j=i;j<=end;j++) c.lineTo(pts[j].x,pts[j].y);
      c.lineWidth=t.w*4.6*df; c.strokeStyle=`rgba(150,200,245,${al*0.16})`; c.stroke();
      c.lineWidth=t.w*df;     c.strokeStyle=`rgba(80,150,225,${al})`;       c.stroke();
    }
    for(let i=0;i<n;i++){
      const p=pts[i]; if(p.r<=0) continue;
      const age=now-p.t, f=fade(age); if(f<=0) continue;
      const df=diffuse(age);
      c.beginPath(); c.arc(p.x+p.dx*df,p.y+p.dy*df,p.r,0,Math.PI*2); c.fillStyle=`rgba(100,165,230,${t.a*f*0.6})`; c.fill();
    }
    if(!t.done){
      c.beginPath(); c.arc(t.x,t.y,7,0,Math.PI*2); c.fillStyle='rgba(120,185,250,0.1)'; c.fill();
      c.beginPath(); c.arc(t.x,t.y,2,0,Math.PI*2); c.fillStyle='rgba(90,165,245,0.55)'; c.fill();
    }
  }

  let last=now, nextSpawn=now+1200;
  function frame(ts){
    now=ts;
    const dt=Math.min(50,ts-last); last=ts;
    c.clearRect(0,0,CW,CH);
    if(now>=nextSpawn&&tracks.length<MAX){ spawn(); nextSpawn=now+rnd(500,1600); }
    for(const t of tracks){ step(t,dt); draw(t); }
    for(let i=tracks.length-1;i>=0;i--){ const t=tracks[i]; if(t.done&&now-t.pts[t.pts.length-1].t>HOLD+FADE) tracks.splice(i,1); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
